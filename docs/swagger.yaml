basePath: /api
definitions:
  handler.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handler.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - email
    - name
    - password
    - role
    - username
    type: object
  handler.K8sBatchRequest:
    properties:
      projects:
        items:
          properties:
            name:
              type: string
            namespace:
              type: string
          type: object
        type: array
      server_id:
        type: integer
    required:
    - projects
    - server_id
    type: object
  handler.K8sFullRequest:
    properties:
      server_id:
        type: integer
    required:
    - server_id
    type: object
  handler.LVSOpRequest:
    properties:
      rs_ip:
        type: string
      server_id:
        type: integer
      state:
        type: string
      vs_ip:
        type: string
    required:
    - rs_ip
    - server_id
    - state
    - vs_ip
    type: object
  handler.LVSSwapRequest:
    properties:
      rs_ip1:
        type: string
      rs_ip2:
        type: string
      server_id:
        type: integer
      vs_ip:
        type: string
    required:
    - rs_ip1
    - rs_ip2
    - server_id
    - vs_ip
    type: object
  handler.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  handler.NginxBatchItem:
    properties:
      action:
        description: '"online", "offline", "toggle"'
        type: string
      backend_ip:
        description: online/offline 时需要
        type: string
      upstream_name:
        type: string
    type: object
  handler.NginxBatchRequestV2:
    properties:
      config_file:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.NginxBatchItem'
        type: array
      server_id:
        type: integer
    required:
    - config_file
    - items
    - server_id
    type: object
  handler.NginxReloadRequest:
    properties:
      server_id:
        type: integer
    required:
    - server_id
    type: object
  handler.NginxRollbackRequest:
    properties:
      backup_file:
        type: string
      config_file:
        type: string
      server_id:
        type: integer
    required:
    - backup_file
    - config_file
    - server_id
    type: object
  handler.NginxSwapRequest:
    properties:
      config_file:
        type: string
      offline_ip:
        type: string
      online_ip:
        type: string
      server_id:
        type: integer
      upstream_names:
        items:
          type: string
        type: array
    required:
    - config_file
    - offline_ip
    - online_ip
    - server_id
    - upstream_names
    type: object
  handler.NginxToggleRequest:
    properties:
      config_file:
        type: string
      server_id:
        type: integer
      upstream_names:
        items:
          type: string
        type: array
    required:
    - config_file
    - server_id
    - upstream_names
    type: object
  handler.NginxUpstreamRequest:
    properties:
      backend_ip:
        type: string
      config_file:
        type: string
      server_id:
        type: integer
      upstream_names:
        items:
          type: string
        type: array
    required:
    - backend_ip
    - config_file
    - server_id
    - upstream_names
    type: object
  handler.PreprodScaleRequest:
    properties:
      resource_names:
        items:
          type: string
        type: array
      server_id:
        type: integer
    required:
    - server_id
    type: object
  handler.PreviewExecuteRequest:
    properties:
      preview_id:
        type: string
    required:
    - preview_id
    type: object
  handler.ResetPasswordRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  handler.UpdateUserRequest:
    properties:
      email:
        type: string
      enabled:
        type: boolean
      name:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - email
    - name
    - role
    - username
    type: object
  model.Server:
    properties:
      auth_type:
        type: string
      backup_path:
        type: string
      config_path:
        type: string
      config_pattern:
        type: string
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      env:
        type: string
      host:
        type: string
      id:
        type: integer
      name:
        type: string
      password:
        type: string
      port:
        type: integer
      private_key:
        type: string
      script_password:
        type: string
      script_path:
        type: string
      server_type:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.ServerResponse:
    properties:
      auth_type:
        type: string
      backup_path:
        type: string
      config_path:
        type: string
      config_pattern:
        type: string
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      env:
        type: string
      has_password:
        type: boolean
      has_private_key:
        type: boolean
      has_script_password:
        type: boolean
      host:
        type: string
      id:
        type: integer
      name:
        type: string
      port:
        type: integer
      script_path:
        type: string
      server_type:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  service.PreprodResource:
    properties:
      age:
        type: string
      available:
        type: integer
      category:
        type: string
      current:
        type: integer
      desired:
        type: integer
      name:
        type: string
      target_replicas:
        type: integer
      up_to_date:
        type: integer
    type: object
  service.RealServer:
    properties:
      active_conn:
        type: integer
      forward:
        type: string
      inact_conn:
        type: integer
      ip:
        type: string
      port:
        type: string
      status:
        type: string
      weight:
        type: integer
    type: object
  service.Rollout:
    properties:
      available:
        type: integer
      desired:
        type: integer
      name:
        type: string
      namespace:
        type: string
      ready:
        type: string
      set_weight:
        type: string
      status:
        type: string
      step:
        type: string
      strategy:
        type: string
      up_to_date:
        type: integer
    type: object
  service.VirtualServer:
    properties:
      ip:
        type: string
      port:
        type: string
      protocol:
        type: string
      real_servers:
        items:
          $ref: '#/definitions/service.RealServer'
        type: array
    type: object
host: localhost:18080
info:
  contact:
    email: support@opscenter.local
    name: API Support
  description: 运维发布管理系统 API 文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: OpsCenter API
  version: "1.0"
paths:
  /k8s/full_online/execute:
    post:
      consumes:
      - application/json
      description: 根据预览 ID 执行 K8s 全量上线操作
      parameters:
      - description: 预览 ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.PreviewExecuteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 执行 K8s 全量上线
      tags:
      - K8s
  /k8s/full_online/preview:
    post:
      consumes:
