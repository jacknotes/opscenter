  /login:
    post:
      consumes:
      - application/json
      description: 用户名密码登录，返回 JWT token
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      summary: 用户登录
      tags:
      - 认证
  /logout:
    post:
      description: 登出当前用户，记录审计日志
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证
  /logs:
    get:
      description: 分页查询操作日志，支持按模块、服务器、用户、状态、时间等筛选
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20，最大 100
        in: query
        name: size
        type: integer
      - description: 模块 (lvs/k8s/nginx/preprod/server)
        in: query
        name: module
        type: string
      - description: 服务器 ID
        in: query
        name: server_id
        type: string
      - description: 用户名（模糊匹配）
        in: query
        name: username
        type: string
      - description: 状态 (success/failed)
        in: query
        name: status
        type: string
      - description: 操作类型
        in: query
        name: action
        type: string
      - description: 开始时间 (2006-01-02)
        in: query
        name: start_time
        type: string
      - description: 结束时间 (2006-01-02)
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 获取操作日志列表
      tags:
      - 操作日志
