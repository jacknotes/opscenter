          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 执行 LVS 上下线操作
      tags:
      - LVS
  /lvs/op/preview:
    post:
      consumes:
      - application/json
      description: 预览 LVS 真实服务器上下线操作的命令和影响
      parameters:
      - description: 操作参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LVSOpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: LVS 上下线操作预览
      tags:
      - LVS
  /lvs/status:
    get:
      description: 获取指定 LVS 服务器的详细状态信息
      parameters:
      - description: 服务器 ID
        in: query
        name: server_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 获取 LVS 状态
      tags:
      - LVS
  /lvs/swap/execute:
    post:
      consumes:
      - application/json
      description: 根据预览 ID 执行 LVS 真实服务器切换操作
      parameters:
      - description: 预览 ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.PreviewExecuteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
