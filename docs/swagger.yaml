  /k8s/rollouts:
    get:
      description: 获取指定 K8s 服务器的 Argo Rollout 列表
      parameters:
      - description: 服务器 ID
        in: query
        name: server_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.Rollout'
            type: array
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 获取 K8s Rollout 列表
      tags:
