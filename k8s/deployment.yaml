apiVersion: apps/v1
kind: Deployment
metadata:
  name: opscenter
  namespace: ops
  labels:
    app: opscenter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opscenter
  template:
    metadata:
      labels:
        app: opscenter
    spec:
      containers:
      - name: opscenter
        image: opscenter:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 18080
          name: http
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /api/health
            port: 18080
          initialDelaySeconds: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 18080
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: opscenter-config
