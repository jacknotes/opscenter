apiVersion: v1
kind: ConfigMap
metadata:
  name: opscenter-config
  namespace: ops
data:
  config.yaml: |
    server:
      port: 18080
      host: 0.0.0.0

    database:
      host: localhost  # 通过环境变量 DB_HOST 覆盖
      port: 3306       # 通过环境变量 DB_PORT 覆盖
      username: opscenter
      dbname: opscenter
      charset: utf8mb4

    jwt:
      secret: ""  # 从 Secret 注入
      expire: 24h

    crypto:
      key: ""  # 从 Secret 注入
