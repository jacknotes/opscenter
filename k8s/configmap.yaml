apiVersion: v1
kind: ConfigMap
metadata:
  name: opscenter-config
  namespace: opscenter
data:
  config.yaml: |
    server:
      port: 18080
      host: 0.0.0.0

    database:
      host: mysql.opscenter.svc.cluster.local
      port: 3306
      username: opscenter
      dbname: opscenter
      charset: utf8mb4

    jwt:
      secret: ""  # 从 Secret 注入
      expire: 24h

    crypto:
      key: ""  # 从 Secret 注入
