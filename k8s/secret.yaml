apiVersion: v1
kind: Secret
metadata:
  name: opscenter-secret
  namespace: ops
type: Opaque
stringData:
  # 外部数据库配置
  DB_HOST: "your-mysql-host"
  DB_PORT: "3306"
  DB_PASSWORD: "your-db-password"
  # JWT 密钥（至少 16 字节）
  JWT_SECRET: "your-secret-key-change-in-production"
  # AES-256 加密密钥（必须 16/24/32 字节）
  CRYPTO_KEY: "your-32-char-aes-key-here---!!!!"
