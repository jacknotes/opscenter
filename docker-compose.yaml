version: "3.8"

services:
  opscenter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opscenter-app
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      - DB_HOST=你的外部MySQL地址
      - DB_PORT=3306
      - DB_PASSWORD=你的数据库密码
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - CRYPTO_KEY=dev-crypto-key-32bytes-long!!
    volumes:
      - ./config.yaml.example:/app/config/config.yaml:ro
