version: "3.8"

# OpsCenter Docker Compose 部署配置
# 使用前请修改 environment 中的数据库连接信息和密钥
services:
  opscenter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opscenter-app
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      - DB_HOST=你的外部MySQL地址
      - DB_PORT=3306
      - DB_PASSWORD=你的数据库密码
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - CRYPTO_KEY=dev-crypto-key-32bytes-long!!
      - TZ=Asia/Shanghai
      # 生产环境取消注释，关闭 GIN 调试日志
      # - GIN_MODE=release
    volumes:
      - ./config.yaml.example:/app/config/config.yaml:ro
